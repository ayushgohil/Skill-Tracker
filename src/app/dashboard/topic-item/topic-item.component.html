<!-- src/app/dashboard/topic-item/topic-item.component.html -->
<div class="border rounded-xl transition-all duration-200 overflow-hidden" [class.border-zinc-700]="!topic.completed"
    [class.border-emerald-500/40]="topic.completed" [class.bg-zinc-900]="true">

    <!-- ── Inline Edit Mode ───────────────────────── -->
    @if (editing()) {
    <div class="px-4 py-3 space-y-2" (click)="$event.stopPropagation()">
        <input [(ngModel)]="editTitle" type="text" (keydown.enter)="saveEdit()" (keydown.escape)="cancelEdit()"
            class="w-full bg-zinc-800 border border-emerald-500 text-white rounded-lg px-3 py-2 text-sm outline-none placeholder:text-zinc-600"
            placeholder="Topic title" />
        <div class="flex items-center gap-2">
            <select [(ngModel)]="editDepth"
                class="bg-zinc-800 border border-zinc-700 text-white rounded-lg px-3 py-1.5 text-xs outline-none focus:border-emerald-500 transition-colors">
                <option value="shallow">Shallow</option>
                <option value="medium">Medium</option>
                <option value="deep">Deep</option>
            </select>
            <button (click)="saveEdit($event)"
                class="bg-emerald-500 hover:bg-emerald-400 text-zinc-950 text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">
                Save
            </button>
            <button (click)="cancelEdit()" class="text-zinc-500 hover:text-white text-xs px-2 py-1.5 transition-colors">
                Cancel
            </button>
        </div>
    </div>

    } @else {
    <!-- ── Normal View Mode ───────────────────────── -->
    <div class="flex items-center gap-3 px-4 py-3 cursor-pointer select-none group/row" (click)="onToggle()">

        <!-- Checkbox -->
        <button (click)="onCheck($event)"
            class="flex-shrink-0 w-5 h-5 rounded border-2 transition-all flex items-center justify-center"
            [class.border-zinc-600]="!topic.completed" [class.border-emerald-500]="topic.completed"
            [class.bg-emerald-500]="topic.completed">
            @if (topic.completed) {
            <svg class="w-3 h-3 text-zinc-950" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            }
        </button>

        <!-- Title -->
        <span class="flex-1 text-sm font-medium transition-colors" [class.text-white]="!topic.completed"
            [class.text-zinc-500]="topic.completed" [class.line-through]="topic.completed">
            {{ topic.title }}
        </span>

        <!-- Depth badge -->
        <span class="text-xs px-2 py-0.5 rounded-full font-medium flex-shrink-0"
            [class]="depthConfig[topic.depth].classes">
            {{ depthConfig[topic.depth].label }}
        </span>

        <!-- Has notes dot -->
        @if (topic.notes) {
        <div class="w-1.5 h-1.5 rounded-full bg-emerald-400 flex-shrink-0"></div>
        }

        <!-- Edit button (visible on hover) -->
        <button (click)="startEdit($event)"
            class="opacity-0 group-hover/row:opacity-100 text-zinc-600 hover:text-zinc-300 transition-all flex-shrink-0 p-0.5"
            title="Edit topic">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
        </button>

        <!-- Delete button (visible on hover) -->
        <button (click)="onDelete($event)"
            class="opacity-0 group-hover/row:opacity-100 text-zinc-600 hover:text-red-400 transition-all flex-shrink-0 p-0.5"
            title="Delete topic">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        </button>

        <!-- Arrow -->
        <svg class="w-4 h-4 text-zinc-600 transition-transform duration-200 flex-shrink-0" [class.rotate-180]="isOpen"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
    </div>

    <!-- Notes panel (accordion) -->
    @if (isOpen) {
    <div class="px-4 pb-4 border-t border-zinc-800 pt-3" (click)="$event.stopPropagation()">
        <label class="text-zinc-500 text-xs block mb-2 flex items-center gap-2">
            Notes · links · thoughts
            <span class="text-zinc-700 text-xs">(auto-saves when you click away)</span>
        </label>
        <textarea [(ngModel)]="localNotes" (input)="onNotesInput()" (blur)="onNotesBlur()"
            placeholder="Paste resources, write what you learned, note open questions..." rows="4"
            class="w-full bg-zinc-800 border border-zinc-700 text-white text-sm rounded-lg px-3 py-2.5 outline-none focus:border-emerald-500 transition-colors placeholder:text-zinc-600 resize-none">
        </textarea>
    </div>
    }
    }
</div>
