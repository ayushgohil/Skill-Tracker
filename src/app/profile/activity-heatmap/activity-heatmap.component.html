<!-- src/app/profile/activity-heatmap/activity-heatmap.component.html -->
<div class="glass-card rounded-2xl p-6 mb-8">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold text-white">Activity</h2>
        <div class="flex items-center gap-4 text-sm">
            <div class="text-zinc-400">
                <span class="text-white font-medium">{{ currentStreak() }}</span> day streak
            </div>
            <div class="text-zinc-400">
                <span class="text-white font-medium">{{ maxStreak() }}</span> max
            </div>
        </div>
    </div>

    @if (loading()) {
        <div class="w-full h-24 bg-zinc-800/50 rounded-xl animate-pulse"></div>
    } @else {
        <div class="flex flex-col md:flex-row gap-6">
            <!-- Left side: Heatmap -->
            <div class="flex-1 overflow-hidden">
                <!-- Heatmap Grid -->
                <div class="flex gap-1 overflow-x-auto pb-2 custom-scrollbar">
                    <div class="grid grid-flow-col grid-rows-7 gap-1">
                        @for (day of days(); track $index) {
                            @if (day.level === -1) {
                                <!-- Empty padding block to align days of week -->
                                <div class="w-3.5 h-3.5"></div>
                            } @else {
                                <div class="w-3.5 h-3.5 rounded-[3px] transition-colors hover:ring-1 hover:ring-white/50 cursor-pointer"
                                     [attr.title]="day.count + ' tasks on ' + day.date?.toLocaleDateString()"
                                     [class.bg-zinc-800]="day.level === 0"
                                     [class.bg-emerald-900]="day.level === 1"
                                     [class.bg-emerald-700]="day.level === 2"
                                     [class.bg-emerald-500]="day.level === 3"
                                     [class.bg-emerald-400]="day.level === 4">
                                </div>
                            }
                        }
                    </div>
                </div>
                
                <div class="mt-4 flex items-center justify-between text-xs text-zinc-500">
                    <div class="flex items-center gap-1">
                        <span>Less</span>
                        <div class="w-3 h-3 rounded-[2px] bg-zinc-800"></div>
                        <div class="w-3 h-3 rounded-[2px] bg-emerald-900"></div>
                        <div class="w-3 h-3 rounded-[2px] bg-emerald-700"></div>
                        <div class="w-3 h-3 rounded-[2px] bg-emerald-500"></div>
                        <div class="w-3 h-3 rounded-[2px] bg-emerald-400"></div>
                        <span>More</span>
                    </div>
                    <span>{{ totalCompletions() }} completions in {{ selectedYear() }}</span>
                </div>
            </div>

            <!-- Right side: Year Sidebar -->
            <div class="w-full md:w-24 flex md:flex-col gap-2 overflow-x-auto md:overflow-visible flex-shrink-0">
                @for (year of availableYears(); track year) {
                    <button (click)="selectYear(year)"
                        class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors whitespace-nowrap md:whitespace-normal text-left"
                        [class.bg-emerald-500]="selectedYear() === year"
                        [class.text-zinc-950]="selectedYear() === year"
                        [class.text-zinc-400]="selectedYear() !== year"
                        [class.hover:bg-white/[0.05]]="selectedYear() !== year"
                        [class.hover:text-white]="selectedYear() !== year">
                        {{ year }}
                    </button>
                }
            </div>
        </div>
    }
</div>
