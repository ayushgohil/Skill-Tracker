<!-- src/app/profile/activity-heatmap/activity-heatmap.component.html -->

<!-- Streak stats row -->
<div class="flex items-center flex-wrap gap-3 sm:gap-4 mb-4">
    <div class="flex items-center gap-1.5">
        <span class="text-base sm:text-lg">🔥</span>
        <div>
            <span class="font-bold text-sm sm:text-base" style="color:var(--text-1)">{{ currentStreak() }}</span>
            <span class="text-xs ml-1" style="color:var(--text-3)">day streak</span>
        </div>
    </div>
    <div class="w-px h-4" style="background:var(--border)"></div>
    <div>
        <span class="font-semibold text-sm" style="color:var(--text-2)">{{ maxStreak() }}</span>
        <span class="text-xs ml-1" style="color:var(--text-3)">best</span>
    </div>
    <div class="w-px h-4" style="background:var(--border)"></div>
    <div>
        <span class="font-semibold text-sm" style="color:var(--text-2)">{{ totalCompletions() }}</span>
        <span class="text-xs ml-1" style="color:var(--text-3)">in {{ selectedYear() }}</span>
    </div>
</div>

@if (loading()) {
    <div class="w-full h-16 sm:h-20 rounded-xl animate-pulse" style="background: var(--skeleton);"></div>
} @else {
    <div class="flex flex-col md:flex-row gap-3 sm:gap-4">

        <!-- Heatmap Grid -->
        <div class="flex-1 min-w-0 overflow-hidden">
            <div class="overflow-x-auto pb-2" style="-webkit-overflow-scrolling: touch;">
                <div class="grid grid-flow-col grid-rows-7 gap-[2px] sm:gap-[3px]" style="min-width: max-content;">
                    @for (day of days(); track $index) {
                        @if (day.level === -1) {
                            <div class="w-2.5 h-2.5 sm:w-3 sm:h-3"></div>
                        } @else {
                            <div class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-[2px] sm:rounded-[3px] cursor-pointer transition-all hover:ring-1 hover:ring-white/30 hover:scale-110"
                                 [attr.title]="day.count + ' tasks on ' + day.date?.toLocaleDateString()"
                                 [class.heat-0]="day.level === 0"
                                 [class.heat-1]="day.level === 1"
                                 [class.heat-2]="day.level === 2"
                                 [class.heat-3]="day.level === 3"
                                 [class.heat-4]="day.level === 4">
                            </div>
                        }
                    }
                </div>
            </div>
        </div>

        <!-- Year selector -->
        @if (availableYears().length > 1) {
        <div class="flex md:flex-col gap-1.5 overflow-x-auto md:overflow-visible flex-shrink-0 pb-1 md:pb-0" style="-webkit-overflow-scrolling: touch;">
            @for (year of availableYears(); track year) {
                <button (click)="selectYear(year)"
                    class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition-all whitespace-nowrap min-h-[32px] touch-manipulation"
                    [class.bg-blue-600]="selectedYear() === year"
                    [class.text-white]="selectedYear() === year"
                    [style.background]="selectedYear() !== year ? 'var(--surface-2)' : null"
                    [style.color]="selectedYear() !== year ? 'var(--text-3)' : null">
                    {{ year }}
                </button>
            }
        </div>
        }
    </div>
}
