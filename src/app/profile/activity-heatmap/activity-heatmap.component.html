<!-- src/app/profile/activity-heatmap/activity-heatmap.component.html -->

<!-- Streak stats row -->
<div class="flex items-center gap-4 mb-4">
    <div class="flex items-center gap-1.5">
        <span class="text-lg">🔥</span>
        <div>
            <span class="text-[#131B2E] font-bold text-base">{{ currentStreak() }}</span>
            <span class="text-[#737686] text-xs ml-1">day streak</span>
        </div>
    </div>
    <div class="w-px h-4 bg-zinc-200"></div>
    <div>
        <span class="text-[#434654] font-semibold text-sm">{{ maxStreak() }}</span>
        <span class="text-[#737686] text-xs ml-1">best</span>
    </div>
    <div class="w-px h-4 bg-zinc-200"></div>
    <div>
        <span class="text-[#434654] font-semibold text-sm">{{ totalCompletions() }}</span>
        <span class="text-[#737686] text-xs ml-1">in {{ selectedYear() }}</span>
    </div>
</div>

@if (loading()) {
    <div class="w-full h-20 rounded-xl animate-pulse" style="background: rgba(255,255,255,0.04);"></div>
} @else {
    <div class="flex flex-col md:flex-row gap-4">

        <!-- Heatmap Grid -->
        <div class="flex-1 overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar pb-1">
                <div class="grid grid-flow-col grid-rows-7 gap-[3px]" style="min-width: max-content;">
                    @for (day of days(); track $index) {
                        @if (day.level === -1) {
                            <div class="w-3 h-3"></div>
                        } @else {
                            <div class="w-3 h-3 rounded-[3px] cursor-pointer transition-all hover:ring-1 hover:ring-white/30 hover:scale-110"
                                 [attr.title]="day.count + ' tasks on ' + day.date?.toLocaleDateString()"
                                 [class.heat-0]="day.level === 0"
                                 [class.heat-1]="day.level === 1"
                                 [class.heat-2]="day.level === 2"
                                 [class.heat-3]="day.level === 3"
                                 [class.heat-4]="day.level === 4">
                            </div>
                        }
                    }
                </div>
            </div>
        </div>

        <!-- Year selector sidebar -->
        @if (availableYears().length > 1) {
        <div class="flex md:flex-col gap-1.5 overflow-x-auto md:overflow-visible flex-shrink-0">
            @for (year of availableYears(); track year) {
                <button (click)="selectYear(year)"
                    class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all whitespace-nowrap"
                    [class.bg-blue-600]="selectedYear() === year"
                    [class.text-white]="selectedYear() === year"
                    [class.text-[#737686]]="selectedYear() !== year"
                    [class.hover:text-[#131B2E]]="selectedYear() !== year"
                    style="{{ selectedYear() !== year ? 'background: rgba(0,0,0,0.04);' : '' }}">
                    {{ year }}
                </button>
            }
        </div>
        }
    </div>
}
