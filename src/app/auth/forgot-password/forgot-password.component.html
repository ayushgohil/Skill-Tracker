<!-- src/app/auth/forgot-password/forgot-password.component.html -->
<div class="flex items-center justify-center min-h-screen px-4 py-8 relative overflow-hidden text-zinc-100 font-sans selection:bg-[#00C8E8]/30 selection:text-white"
     style="background: linear-gradient(165deg, #03001e 0%, #7303c0 50%, #ec38bc 100%);">

    <!-- Backdrop Canvas -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-20 -right-20 w-[280px] h-[280px] sm:w-[500px] sm:h-[500px] bg-[#00C8E8]/40 rounded-full blur-[80px] sm:blur-[140px] animate-pulse" style="animation-duration: 8s;"></div>
        <div class="absolute top-1/3 -left-20 sm:-left-60 w-[250px] h-[250px] sm:w-[600px] sm:h-[600px] bg-[#7303c0]/50 rounded-full blur-[100px] sm:blur-[160px] animate-pulse" style="animation-duration: 12s; animation-delay: 2s;"></div>
        <div class="absolute -bottom-20 right-1/4 w-[200px] h-[200px] sm:w-[450px] sm:h-[450px] bg-[#ec38bc]/30 rounded-full blur-[80px] sm:blur-[120px] animate-pulse" style="animation-duration: 10s; animation-delay: 4s;"></div>
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#ffffff05_1px,transparent_1px),linear-gradient(to_bottom,#ffffff05_1px,transparent_1px)] bg-[size:32px_32px] sm:bg-[size:40px_40px]"></div>
    </div>

    <div class="w-full max-w-xs sm:max-w-sm relative z-10">

        <!-- Branding Header -->
        <div class="flex items-center justify-center mb-6 sm:mb-8 animate-fade-in">
            <img src="assets/nextlyr-logo.png" onerror="this.src='nextlyr-logo.png'" alt="Nextlyr Logo" class="w-36 sm:w-48 h-auto max-h-14 sm:max-h-16 object-contain" />
        </div>

        <!-- Glass Container -->
        <div class="bg-zinc-950/40 border border-white/10 rounded-[24px] sm:rounded-[32px] p-5 sm:p-7 shadow-2xl animate-scale-in backdrop-blur-2xl">

            @if (success()) {
            <!-- Success state -->
            <div class="text-center py-4">
                <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center mx-auto mb-4">
                    <svg class="w-6 h-6 sm:w-7 sm:h-7 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <h2 class="text-white font-extrabold text-lg sm:text-xl mb-2 tracking-wide">Check your inbox</h2>
                <p class="text-zinc-400 text-sm font-medium leading-relaxed mb-6">
                    We sent a password reset link to<br>
                    <span class="text-white font-bold break-all">{{ email }}</span>
                </p>
                <a routerLink="/auth/login"
                    class="text-[#00C8E8] hover:underline font-bold transition-all text-sm">
                    ← Back to sign in
                </a>
            </div>

            } @else {
            <!-- Input State -->
            <h2 class="text-white font-extrabold text-lg sm:text-xl mb-2 tracking-wide">Reset password</h2>
            <p class="text-zinc-400 text-sm font-medium mb-5 sm:mb-6 leading-relaxed">
                Enter your email address and we'll send you a link to restore access.
            </p>

            @if (error()) {
            <div class="flex items-center gap-2.5 bg-red-500/10 border border-red-500/20 text-red-400 text-sm rounded-2xl px-4 py-3 mb-4 sm:mb-5 font-bold animate-slide-up">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                {{ error() }}
            </div>
            }

            <div class="space-y-4">
                <div>
                    <label class="text-zinc-300 text-[10px] sm:text-xs font-bold uppercase tracking-wide block mb-1.5">Email Address</label>
                    <input [(ngModel)]="email" type="email" placeholder="you@example.com"
                           (keydown.enter)="submit()"
                           class="w-full h-12 min-h-[48px] px-4 rounded-2xl bg-white/5 border border-white/10 text-white text-sm font-medium outline-none focus:border-[#00C8E8] focus:bg-white/10 transition-all" />
                </div>

                <button (click)="submit()" [disabled]="loading()"
                        class="w-full h-12 min-h-[48px] bg-white hover:bg-zinc-100 text-[#03001e] text-sm font-bold rounded-2xl transition-all flex items-center justify-center shadow-xl mt-2 active:scale-[0.98] disabled:opacity-50 touch-manipulation">
                    {{ loading() ? 'Sending link...' : 'Send reset link' }}
                </button>
            </div>

            <div class="text-center mt-5 sm:mt-6">
                <a routerLink="/auth/login" class="text-zinc-400 hover:text-white font-semibold transition-all text-sm">
                    ← Back to sign in
                </a>
            </div>
            }

        </div>
    </div>
</div>
