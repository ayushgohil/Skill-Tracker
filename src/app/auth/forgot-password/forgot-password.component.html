<!-- src/app/auth/forgot-password/forgot-password.component.html -->
<div class="page-gradient flex items-center justify-center min-h-screen px-4">

    <div class="fixed inset-0 z-0 pointer-events-none"
        style="background-image: radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 28px 28px;">
    </div>

    <div class="w-full max-w-sm relative z-10">

        <!-- Logo -->
        <div class="text-center mb-8 animate-fade-in">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-500 shadow-[0_0_32px_rgba(16,185,129,0.4)] mb-4">
                <svg class="w-7 h-7 text-zinc-950" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight mb-1">SkillTracker</h1>
            <p class="text-zinc-500 text-sm">Track what you learn. Own your growth.</p>
        </div>

        <!-- Card -->
        <div class="glass-card rounded-2xl p-7 animate-scale-in">

            @if (success()) {
            <!-- Success state -->
            <div class="text-center py-4">
                <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center mx-auto mb-4">
                    <svg class="w-7 h-7 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <h2 class="text-white font-bold text-lg mb-2">Check your inbox</h2>
                <p class="text-zinc-500 text-sm leading-relaxed mb-6">
                    We sent a password reset link to<br>
                    <span class="text-white font-medium">{{ email }}</span>
                </p>
                <a routerLink="/auth/login"
                    class="text-emerald-400 hover:text-emerald-300 transition-colors text-sm font-medium">
                    ← Back to sign in
                </a>
            </div>

            } @else {

            <div class="mb-6">
                <h2 class="text-white font-bold text-lg">Forgot password?</h2>
                <p class="text-zinc-500 text-sm mt-1">Enter your email and we'll send a reset link.</p>
            </div>

            @if (error()) {
            <div class="flex items-center gap-2.5 bg-red-500/[0.08] border border-red-500/20 text-red-400 text-sm rounded-xl px-4 py-3 mb-5">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                {{ error() }}
            </div>
            }

            <div class="space-y-4">
                <div>
                    <label class="text-zinc-500 text-xs font-semibold uppercase tracking-wide block mb-1.5">Email</label>
                    <input [(ngModel)]="email" type="email" placeholder="you@example.com"
                        (keydown.enter)="submit()" class="input" />
                </div>
                <button (click)="submit()" [disabled]="loading()" class="btn-primary w-full justify-center mt-1">
                    {{ loading() ? 'Sending...' : 'Send reset link' }}
                </button>
            </div>

            <p class="text-zinc-600 text-sm text-center mt-6">
                Remember your password?
                <a routerLink="/auth/login" class="text-emerald-400 hover:text-emerald-300 transition-colors font-medium">Sign in</a>
            </p>
            }
        </div>

    </div>
</div>
