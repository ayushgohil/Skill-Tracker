<!-- src/app/auth/forgot-password/forgot-password.component.html -->
<div class="flex items-center justify-center min-h-screen px-4 relative overflow-hidden"
     style="background: linear-gradient(160deg, #0A2272 0%, #1A56DB 60%, #00C8E8 100%);">

    <!-- Visual Context Image (Deep blue generative gradient flow) -->
    <div class="absolute inset-0 opacity-40 pointer-events-none z-0">
        <img alt="Abstract generative flow" class="w-full h-full object-cover" 
             src="https://lh3.googleusercontent.com/aida-public/AB6AXuDe5dPamX4aL0YBJ77PZBtm5ModZ-yzbSLV95FBVWa3EEyM1-jSHi6rxbVz7AJmA4aJ4ru2xCaCaxu4XIOiv75v9zgkVa2Oj8RIJ6Tuk3tfEm6lwvrHRML9-fLmEY4v_k-f6YhaR1-wlrnEZhQMobLKakRKWhHHesiiJfNUZmCZ8uQJAI2yPj2AN9itMj3UsXffbTziqcxklxr4uP-8TaM6Ci29cy_EwO6tYNBijc5SFsC7RhjNWlc_TpW0w7xH65ZU3K4LEP8pd4A"/>
    </div>

    <!-- Background Decorative Elements -->
    <div class="absolute inset-0 opacity-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-10%] w-64 h-64 rounded-full bg-white blur-3xl"></div>
        <div class="absolute bottom-[-5%] left-[-5%] w-80 h-80 rounded-full bg-cyan-400 blur-3xl"></div>
    </div>

    <div class="w-full max-w-sm relative z-10">

        <!-- Logo -->
        <div class="text-center mb-8 animate-fade-in">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white shadow-xl mb-4 transform rotate-3 transition-transform hover:rotate-0">
                <svg class="w-7 h-7 text-[#1A56DB]" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight mb-1">Nextlyr</h1>
            <p class="text-white/70 text-sm">Track what you learn. Own your growth.</p>
        </div>

        <!-- Card -->
        <div class="bg-white border border-zinc-100 rounded-[32px] p-7 shadow-2xl animate-scale-in">

            @if (success()) {
            <!-- Success state -->
            <div class="text-center py-4">
                <div class="w-14 h-14 rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center justify-center mx-auto mb-4">
                    <svg class="w-7 h-7 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <h2 class="text-[#131B2E] font-black text-xl mb-2">Check your inbox</h2>
                <p class="text-[#737686] text-sm font-medium leading-relaxed mb-6">
                    We sent a password reset link to<br>
                    <span class="text-[#131B2E] font-bold">{{ email }}</span>
                </p>
                <a routerLink="/auth/login"
                    class="text-blue-600 hover:text-blue-700 font-bold transition-colors text-sm">
                    ← Back to sign in
                </a>
            </div>

            } @else {

            <div class="mb-6">
                <h2 class="text-[#131B2E] font-black text-xl">Forgot password?</h2>
                <p class="text-[#737686] text-sm font-medium mt-1">Enter your email and we'll send a reset link.</p>
            </div>

            @if (error()) {
            <div class="flex items-center gap-2.5 bg-red-50 border border-red-200 text-red-600 text-sm rounded-2xl px-4 py-3 mb-5 font-bold">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                {{ error() }}
            </div>
            }

            <div class="space-y-4">
                <div>
                    <label class="text-[#737686] text-xs font-bold uppercase tracking-wide block mb-1.5">Email</label>
                    <input [(ngModel)]="email" type="email" placeholder="you@example.com"
                        (keydown.enter)="submit()" class="w-full h-12 px-4 rounded-2xl bg-[#F4F5FC] border border-zinc-200 text-[#131B2E] text-sm font-medium outline-none focus:border-blue-500 focus:bg-white transition-all" />
                </div>
                <button (click)="submit()" [disabled]="loading()" class="w-full h-12 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-2xl transition-all flex items-center justify-center shadow-lg shadow-blue-600/20 mt-2 disabled:opacity-50">
                    {{ loading() ? 'Sending...' : 'Send reset link' }}
                </button>
            </div>

            <p class="text-[#737686] text-sm text-center mt-6 font-medium">
                Remember your password?
                <a routerLink="/auth/login" class="text-blue-600 hover:text-blue-700 font-bold transition-colors">Sign in</a>
            </p>
            }
        </div>

    </div>
</div>
