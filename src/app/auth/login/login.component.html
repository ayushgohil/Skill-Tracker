<!-- src/app/auth/login/login.component.html -->
<div class="page-gradient flex items-center justify-center min-h-screen px-4">

    <!-- Dot grid background -->
    <div class="fixed inset-0 z-0 pointer-events-none"
        style="background-image: radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 28px 28px;">
    </div>

    <div class="w-full max-w-sm relative z-10">

        <!-- Logo + Branding -->
        <div class="text-center mb-8 animate-fade-in">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-500 shadow-[0_0_32px_rgba(16,185,129,0.4)] mb-4">
                <svg class="w-7 h-7 text-zinc-950" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight mb-1">SkillTracker</h1>
            <p class="text-zinc-500 text-sm">Track what you learn. Own your growth.</p>
        </div>

        <!-- Card -->
        <div class="glass-card rounded-2xl p-7 animate-scale-in">
            <h2 class="text-white font-bold text-lg mb-6">Welcome back</h2>

            <!-- Error -->
            @if (error()) {
            <div class="flex items-center gap-2.5 bg-red-500/[0.08] border border-red-500/20 text-red-400 text-sm rounded-xl px-4 py-3 mb-5">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                {{ error() }}
            </div>
            }

            <!-- Google Sign-in -->
            <button (click)="loginWithGoogle()" [disabled]="googleLoading() || loading()"
                class="w-full flex items-center justify-center gap-3 rounded-xl px-4 py-2.5 text-sm font-semibold text-zinc-200 border transition-all mb-5"
                style="background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.1);"
                onmouseenter="this.style.background='rgba(255,255,255,0.08)'"
                onmouseleave="this.style.background='rgba(255,255,255,0.04)'">
                @if (googleLoading()) {
                <svg class="w-4 h-4 animate-spin text-zinc-400" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                </svg>
                Connecting...
                } @else {
                <!-- Google G logo -->
                <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
                }
            </button>

            <!-- Divider -->
            <div class="flex items-center gap-3 mb-5">
                <div class="flex-1 h-px" style="background: rgba(255,255,255,0.07);"></div>
                <span class="text-zinc-700 text-xs font-medium">or sign in with email</span>
                <div class="flex-1 h-px" style="background: rgba(255,255,255,0.07);"></div>
            </div>

            <!-- Email + Password form -->
            <div class="space-y-4">
                <div>
                    <label class="text-zinc-500 text-xs font-semibold uppercase tracking-wide block mb-1.5">Email</label>
                    <input [(ngModel)]="email" type="email" placeholder="you@example.com" class="input" />
                </div>

                <!-- Password with show/hide toggle -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-zinc-500 text-xs font-semibold uppercase tracking-wide">Password</label>
                        <a routerLink="/auth/forgot-password"
                            class="text-zinc-500 text-xs hover:text-emerald-400 transition-colors">
                            Forgot password?
                        </a>
                    </div>
                    <div class="relative">
                        <input [(ngModel)]="password"
                            [type]="showPassword() ? 'text' : 'password'"
                            placeholder="••••••••"
                            (keydown.enter)="submit()"
                            class="input pr-10" />
                        <!-- Eye toggle -->
                        <button type="button" (click)="showPassword.update(v => !v)"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-600 hover:text-zinc-300 transition-colors"
                            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
                            @if (showPassword()) {
                            <!-- Eye-off -->
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                            } @else {
                            <!-- Eye -->
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            }
                        </button>
                    </div>
                </div>

                <button (click)="submit()" [disabled]="loading() || googleLoading()" class="btn-primary w-full justify-center mt-1">
                    {{ loading() ? 'Signing in...' : 'Sign in' }}
                </button>
            </div>

            <p class="text-zinc-600 text-sm text-center mt-6">
                No account?
                <a routerLink="/auth/register" class="text-emerald-400 hover:text-emerald-300 transition-colors font-medium">
                    Create one
                </a>
            </p>
        </div>

    </div>
</div>
