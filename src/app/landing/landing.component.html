<!-- src/app/landing/landing.component.html -->
<main class="flex-1 flex flex-col items-center justify-between px-6 py-16 relative overflow-hidden min-h-screen"
      style="background: linear-gradient(160deg, #0A2272 0%, #1A56DB 60%, #00C8E8 100%);">

    <!-- Background Decorative Elements -->
    <div class="absolute inset-0 opacity-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-10%] w-64 h-64 rounded-full bg-white blur-3xl"></div>
        <div class="absolute bottom-[-5%] left-[-5%] w-80 h-80 rounded-full bg-cyan-400 blur-3xl"></div>
    </div>

    <!-- Visual Context Image (Deep blue generative gradient flow) -->
    <div class="absolute inset-0 opacity-40 pointer-events-none z-0">
        <img alt="Abstract generative flow" class="w-full h-full object-cover" 
             src="https://lh3.googleusercontent.com/aida-public/AB6AXuDe5dPamX4aL0YBJ77PZBtm5ModZ-yzbSLV95FBVWa3EEyM1-jSHi6rxbVz7AJmA4aJ4ru2xCaCaxu4XIOiv75v9zgkVa2Oj8RIJ6Tuk3tfEm6lwvrHRML9-fLmEY4v_k-f6YhaR1-wlrnEZhQMobLKakRKWhHHesiiJfNUZmCZ8uQJAI2yPj2AN9itMj3UsXffbTziqcxklxr4uP-8TaM6Ci29cy_EwO6tYNBijc5SFsC7RhjNWlc_TpW0w7xH65ZU3K4LEP8pd4A"/>
    </div>

    <!-- Center Layout -->
    <div class="flex-1 flex flex-col items-center justify-center text-center z-10 relative">
        <!-- Full Logo -->
        <div class="flex items-center gap-4 mb-6">
            <div class="w-14 h-14 bg-white rounded-2xl shadow-xl flex items-center justify-center transform rotate-3 transition-transform hover:rotate-0">
                <svg class="w-7 h-7 text-[#1A56DB]" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <h1 class="text-4xl font-black text-white tracking-tight">Nextlyr</h1>
        </div>
        
        <!-- Badge Pill -->
        <div class="inline-flex items-center px-4 py-1 rounded-full border border-white/30 bg-white/10 text-[#00C8E8] text-xs font-bold mb-6 uppercase tracking-widest">
            Skill Tracker
        </div>
        
        <!-- Tagline -->
        <p class="text-white/80 text-base font-medium max-w-[240px] leading-relaxed">
            Level up, one skill at a time.
        </p>
    </div>

    <!-- Action Section -->
    <div class="w-full max-w-sm space-y-4 z-10 relative">
        <!-- Primary Action -->
        <a routerLink="/auth/register" 
           class="w-full h-14 bg-white text-[#1A56DB] font-bold rounded-full flex items-center justify-center gap-2 hover:bg-zinc-50 active:scale-95 transition-all shadow-xl text-base">
            Get Started
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
        </a>

        <!-- Secondary Action -->
        <div class="text-center">
            <p class="text-white/60 text-sm font-medium">
                Already have an account? 
                <a routerLink="/auth/login" 
                   class="text-white font-bold underline underline-offset-4 decoration-white/30 hover:decoration-white transition-all">
                    Sign In
                </a>
            </p>
        </div>
    </div>
</main>
